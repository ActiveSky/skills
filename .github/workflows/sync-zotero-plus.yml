name: Sync zotero-plus

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if UPSTREAM_VERSION matches"
        type: boolean
        default: false
  repository_dispatch:
    types:
      - zotero-plus-updated

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-zotero-plus
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get upstream main commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api repos/ActiveSky/zotero-plus/commits/main --jq .sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Compare with vendored version
        id: check
        run: |
          current=""
          if [ -f skills/zotero-plus/UPSTREAM_VERSION ]; then
            current="$(sed -n 's/^commit: //p' skills/zotero-plus/UPSTREAM_VERSION)"
          fi
          if [ "$current" = "${{ steps.upstream.outputs.sha }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync vendored skill
        if: steps.check.outputs.changed == 'true'
        run: |
          pwsh ./scripts/sync-zotero-plus.ps1 \
            -Ref main \
            -Commit "${{ steps.upstream.outputs.sha }}"

      - name: Open/update PR and auto-merge
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/sync-zotero-plus"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills/zotero-plus

          if git diff --cached --quiet; then
            echo "No file changes"
            exit 0
          fi

          git commit -m "chore(zotero-plus): sync upstream ${{ steps.upstream.outputs.short }}"
          git push --force origin "$branch"

          pr="$(gh pr list --state open --head "$branch" --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create \
              --title "chore(zotero-plus): sync upstream ${{ steps.upstream.outputs.short }}" \
              --body "Automated sync from ActiveSky/zotero-plus main (${{ steps.upstream.outputs.sha }})." \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch"
            pr="$(gh pr list --state open --head "$branch" --json number -q '.[0].number')"
          fi

          merged=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$pr" --auto --squash; then
              merged=true
              break
            fi
            sleep 10
          done
          if [ "$merged" != "true" ]; then
            echo "Failed to enable auto-merge for PR #$pr" >&2
            exit 1
          fi
