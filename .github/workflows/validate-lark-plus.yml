name: Validate lark-plus

on:
  pull_request:
    paths:
      - "skills/lark-plus/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate vendored skills
        run: pwsh ./skills/lark-plus/scripts/validate-lark-plus.ps1
